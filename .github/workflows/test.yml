name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          registry-url: "https://registry.npmjs.org"

      - name: Get npm cache directory
        id: npm-cache-dir
        shell: bash
        run: echo "dir=$(npm config get cache)" >> ${GITHUB_OUTPUT}

      - uses: actions/cache@v4
        id: npm-cache # use this to check for `cache-hit` ==> if: steps.npm-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Run native addon regression tests
        run: npm run test:addon

      - name: Download pinned TDLib binary
        id: tdlib
        run: |
          path=$(node scripts/test-binary-module.js)
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Test concurrent workers with real TDLib
        run: |
          node test/worker-threads.cjs public
          node test/worker-threads.cjs termination
          node test/worker-threads.cjs raw
        env:
          TDLIB_PATH: ${{ steps.tdlib.outputs.path }}

      - name: Run test
        run: npm test -- --run
        env:
          TDLIB_PATH: ${{ steps.tdlib.outputs.path }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
