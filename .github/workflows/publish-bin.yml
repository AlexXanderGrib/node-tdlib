name: Publish prebuilt TDLib
on:
  workflow_dispatch:

concurrency:
  group: publish-prebuilt-tdlib
  cancel-in-progress: false

jobs:
  test-base:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel, macos-15, windows-2022]
        version: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download pinned TDLib binary
        id: tdlib
        shell: bash
        run: |
          path=$(node scripts/test-binary-module.js)
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Test
        run: npm test -- --run
        env:
          TDLIB_PATH: ${{ steps.tdlib.outputs.path }}

  test-linux-arm64:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        version: [20, 22, 24]
        image: [bookworm, alpine]
    steps:
      - uses: actions/checkout@v4
      - name: Test glibc and musl on ARM64
        run: |
          docker run --rm --memory="10gb" \
            -v "$PWD:/usr/src/app" node:${{ matrix.version }}-${{ matrix.image }} \
            sh -c "cd /usr/src/app && ./scripts/test-linux-arm64.sh"

  publish:
    runs-on: ubuntu-24.04
    needs: [test-base, test-linux-arm64]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      - name: Publish platform packages, then dispatcher
        run: node scripts/publish-binaries.js
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
